          if os.path.exists(path3):
              with open(path3, 'r') as f:
                  content = f.read()
              # 删除垃圾内容
              content = content.replace('}        )\n}\n}\n}\n}\n', '}\n')
              with open(path3, 'w') as f:
                  f.write(content)
              print(f"✓ Fixed {path3}")
          
          # 修复 WebExecutorScreen.kt
          path4 = "app/src/main/java/com/caifenxi/app/ui/screens/WebExecutorScreen.kt"
          if os.path.exists(path4):
              with open(path4, 'r') as f:
                  lines = f.readlines()
              if len(lines) > 300:
                  # 截断到240行并确保正确结束
                  fixed = lines[:240]
                  if fixed[-1].strip() != '}':
                      fixed.append('}\n')
                  with open(path4, 'w') as f:
                      f.writelines(fixed)
                  print(f"✓ Truncated {path4} to 240 lines")
          
