name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "可选：仓库内 zip 相对路径，如 releases/source.zip（留空则用仓库源码）"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Extract ZIP if provided
        run: |
          set -e
          ZIP="${{ github.event.inputs.source_zip }}"
          # 也自动扫描常见位置的 zip
          if [ -z "$ZIP" ]; then
            for c in \
              Smart-Trader-APK-ready.zip \
              source.zip \
              app-source.zip \
              releases/*.zip \
              dist/*.zip; do
              if [ -f "$c" ]; then ZIP="$c"; break; fi
            done
          fi

          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            echo "Extracting $ZIP ..."
            mkdir -p _src
            unzip -q -o "$ZIP" -d _src
            echo "extracted=1" >> $GITHUB_ENV
          else
            echo "No zip found, use repository tree"
            echo "extracted=0" >> $GITHUB_ENV
          fi

      - name: Locate project root (gradlew)
        id: root
        run: |
          set -e
          # 优先搜索解压目录，再搜仓库根
          SEARCH_DIRS="."
          [ -d _src ] && SEARCH_DIRS="_src ."

          FOUND=""
          for base in $SEARCH_DIRS; do
            # 优先 android/gradlew
            if [ -f "$base/android/gradlew" ]; then
              FOUND="$base/android"
              break
            fi
            # 任意 gradlew
            G=$(find "$base" -name gradlew -type f 2>/dev/null | head -1)
            if [ -n "$G" ]; then
              FOUND=$(dirname "$G")
              break
            fi
            # 仅有 build.gradle.kts 的 android 目录
            if [ -f "$base/android/app/build.gradle.kts" ]; then
              FOUND="$base/android"
              break
            fi
          done

          if [ -z "$FOUND" ]; then
            echo "ERROR: cannot find Android project (gradlew)"
            find . -maxdepth 4 \( -name gradlew -o -name "build.gradle.kts" \) | head -30
            exit 1
          fi

          # 转成绝对路径
          FOUND=$(cd "$FOUND" && pwd)
          echo "PROJECT_ROOT=$FOUND"
          echo "dir=$FOUND" >> $GITHUB_ENV
          echo "dir=$FOUND" >> $GITHUB_OUTPUT

          # 若没有 wrapper，尝试从仓库 android 复制（可选）
          if [ ! -f "$FOUND/gradlew" ]; then
            echo "WARNING: no gradlew in $FOUND"
          fi

      - name: Prepare Android SDK (no interactive licenses)
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          mkdir -p "$SDK/licenses"
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$SDK/licenses/android-sdk-preview-license"
          echo -e "d56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$SDK/licenses/android-sdk-arm-dbt-license"
          echo -e "33b6a2b64607f11b759f320ef9cffc76f9f6a622\n" > "$SDK/licenses/google-gdk-license"
          echo -e "e9acab5b5f89150e0cfd9fe77af5f9599ca0f67d\n" > "$SDK/licenses/android-googletv-license"
          echo -e "601085b94cd77f0b54ff86406957099ebe79c4d6\n" > "$SDK/licenses/android-googlexr-license"

          SM=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$(ls -d $SDK/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"; do
            if [ -x "$c" ]; then SM="$c"; break; fi
          done
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
            "$SM" --sdk_root="$SDK" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          echo "sdk.dir=\( SDK" > " \){{ env.dir }}/local.properties"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          cat "${{ env.dir }}/local.properties"

      - name: Build Debug APK
        working-directory: ${{ env.dir }}
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-trader-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
