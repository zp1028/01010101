# ============================================================
  # 1. Automatically extract source ZIP and locate Android root
  # ============================================================

  prepare-source:
    name: Extract Source ZIP and Locate Android Project
    runs-on: ubuntu-latest

    outputs:
      project_root: ${{ steps.locate.outputs.project_root }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: bash
        run: |
          echo "===== Repository ====="
          find . -maxdepth 3 -type f | sort | head -300

      - name: Find source ZIP
        id: zip
        shell: bash
        run: |
          set -e

          mkdir -p build_source

          ZIP_FILE=""

          # 优先寻找常见源码 ZIP
          for FILE in \
            ./source.zip \
            ./project.zip \
            ./android.zip \
            ./Smart-Trader-V2.zip
          do
            if [ -f "$FILE" ]; then
              ZIP_FILE="$FILE"
              break
            fi
          done

          # 如果没有固定名称，则自动寻找 ZIP
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE=$(find . \
              -maxdepth 3 \
              -type f \
              -iname "*.zip" \
              -not -path "./.git/*" \
              | head -1 || true)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Found source ZIP:"
            echo "$ZIP_FILE"

            echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          else
            echo "No source ZIP found."
            echo "zip_file=" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract source ZIP
        if: steps.zip.outputs.zip_file != ''
        shell: bash
        run: |
          set -e

          ZIP_FILE="${{ steps.zip.outputs.zip_file }}"

          echo "Extracting:"
          echo "$ZIP_FILE"

          rm -rf build_source
          mkdir -p build_source

          unzip -q "$ZIP_FILE" -d build_source

          echo "===== Extracted files ====="
          find build_source \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -500

      - name: Select source workspace
        shell: bash
        run: |
          set -e

          # 如果存在 ZIP，优先使用解压内容
          if [ -d "build_source" ] && [ "$(find build_source -type f | wc -l)" -gt 0 ]; then
            echo "Using extracted source."

            # 让后续步骤可以直接使用 build_source
            touch build_source/.source_workspace
          else
            echo "No extracted source."
            echo "Using repository source directly."
          fi

      - name: Locate Android project root
        id: locate
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching Android project root"
          echo "======================================"

          SEARCH_ROOT="."

          if [ -f "build_source/.source_workspace" ]; then
            SEARCH_ROOT="./build_source"
          fi

          ROOT=""
          BEST_SCORE=-1

          while IFS= read -r SETTINGS; do

            DIR="$(dirname "$SETTINGS")"

            SCORE=0

            if [ -f "$DIR/gradlew" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              SCORE=$((SCORE + 50))
            fi

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              SCORE=$((SCORE + 20))
            fi

            if [ -d "$DIR/app" ]; then
              SCORE=$((SCORE + 30))
            fi

            if [ -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
              SCORE=$((SCORE + 30))
            fi

            echo "Candidate: $DIR"
            echo "Score: $SCORE"
            echo

            if [ "$SCORE" -gt "$BEST_SCORE" ]; then
              ROOT="$DIR"
              BEST_SCORE="$SCORE"
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -not -path "*/.gradle/*" \
              -not -path "*/build/*"
          )

          if [ -z "$ROOT" ]; then
            echo "::error::Android project root not found."
            echo
            echo "Repository structure:"
            find "$SEARCH_ROOT" \
              -maxdepth 5 \
              -type f \
              | sort \
              | head -500
            exit 1
          fi

          # 去掉 ./ 前缀
          ROOT="${ROOT#./}"

          if [ -z "$ROOT" ]; then
            ROOT="."
          fi

          echo "======================================"
          echo "Selected Android root:"
          echo "$ROOT"
          echo "Score:"
          echo "$BEST_SCORE"
          echo "======================================"

          echo "project_root=$ROOT" >> "$GITHUB_OUTPUT"

      - name: Verify selected project
        shell: bash
        run: |
          set -e

          ROOT="${{ steps.locate.outputs.project_root }}"

          echo "Selected root:"
          echo "$ROOT"

          if [ ! -f "$ROOT/settings.gradle" ] && \
             [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "::error::settings.gradle not found."
            exit 1
          fi

          if [ ! -f "$ROOT/gradlew" ]; then
            echo "::error::gradlew not found."
            exit 1
          fi

          if [ ! -d "$ROOT/app" ]; then
            echo "::error::app directory not found."
            exit 1
          fi

          echo "ANDROID_PROJECT_OK"

      - name: Upload extracted source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-trader-v2-source-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build_source/
