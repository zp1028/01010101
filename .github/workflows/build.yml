name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source
        run: |
          set -e
          ARCHIVE=$(ls *.zip *.tar.gz 2>/dev/null | head -1)
          if [ -z "$ARCHIVE" ]; then
            echo "No archive found in repo root"
            ls -la
            exit 1
          fi
          echo "ARCHIVE=$ARCHIVE"
          case "$ARCHIVE" in
            *.zip) unzip -o "$ARCHIVE" ;;
            *.tar.gz) tar -xzf "$ARCHIVE" ;;
          esac

      - name: Find project root
        run: |
          set -e
          ROOT=$(find . -maxdepth 3 -name settings.gradle.kts | head -1 | xargs dirname)
          if [ -z "$ROOT" ] || [ "$ROOT" = "." ]; then
            ROOT="."
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Project root: $ROOT"

      - name: Fix corrupted source files
        run: |
          set -e
          cd "$PROJECT_ROOT"
          
          echo "=== Rewriting corrupted Kotlin files ==="
          
          # 用 Python 重写 MoreScreen.kt
          python3 << 'PYEOF'
