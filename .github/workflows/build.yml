name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract ZIP if present
        run: |
          set -e
          for c in Smart-Trader-APK-ready.zip source.zip app-source.zip; do
            if [ -f "$c" ]; then
              echo "Extracting $c"
              mkdir -p _src
              unzip -q -o "$c" -d _src
              break
            fi
          done
          # 若根目录还有其它 zip，尝试第一个
          if [ ! -d _src ]; then
            c=$(ls -1 *.zip 2>/dev/null | head -1 || true)
            if [ -n "$c" ] && [ -f "$c" ]; then
              echo "Extracting $c"
              mkdir -p _src
              unzip -q -o "$c" -d _src
            fi
          fi

      - name: Locate Android project root
        run: |
          set -e
          FOUND=""
          if [ -f _src/android/gradlew ]; then
            FOUND="_src/android"
          elif [ -f android/gradlew ]; then
            FOUND="android"
          else
            FOUND=$(find _src . -name gradlew -type f 2>/dev/null | head -1 | xargs -r dirname)
          fi
          if [ -z "$FOUND" ] || [ ! -d "$FOUND" ]; then
            echo "ERROR: gradlew not found"
            find . -name gradlew -o -name "build.gradle.kts" | head -30
            exit 1
          fi
          FOUND=$(cd "$FOUND" && pwd)
          echo "PROJECT_ROOT=$FOUND"
          echo "dir=$FOUND" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'sdk.dir=%s\n' "$SDK" > "$dir/local.properties"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" || true
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          cat "$dir/local.properties"

      - name: Fix gradlew
        working-directory: ${{ env.dir }}
        run: |
          set -e
          printf '%s\n' \
            '#!/bin/sh' \
            'APP_HOME=\( (cd " \)(dirname "$0")" && pwd -P) || exit 1' \
            'CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar' \
            'if [ ! -f "$CLASSPATH" ]; then echo "missing $CLASSPATH" >&2; exit 1; fi' \
            'if [ -n "$JAVA_HOME" ] && [ -x "$JAVA_HOME/bin/java" ]; then JAVACMD="$JAVA_HOME/bin/java"; else JAVACMD=java; fi' \
            'exec "$JAVACMD" -Xmx64m -Xms64m -classpath "\( CLASSPATH" org.gradle.wrapper.GradleWrapperMain " \)@"' \
            > gradlew
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/gradle-wrapper.jar
          cat gradlew

      - name: Build Debug APK
        working-directory: ${{ env.dir }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: smart-trader-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
