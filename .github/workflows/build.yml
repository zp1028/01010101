name: Build APK From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 4. 找到 ZIP
      - name: Find ZIP
        id: find_zip
        run: |
          ZIP=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "没有找到 ZIP 文件"
            exit 1
          fi

          echo "找到 ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 5. 自动解压
      - name: Extract ZIP
        run: |
          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d source

          echo "解压完成"
          find source -maxdepth 4 -type f | head -200

      # 6. 自动寻找 Android 工程
      - name: Find Android Project
        id: project
        run: |
          ROOT=""

          while IFS= read -r FILE; do
            DIR=$(dirname "$FILE")

            if [ -f "$DIR/gradlew" ] && \
               { [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; }; then

              ROOT="$DIR"
              break
            fi
          done < <(
            find source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \)
          )

          if [ -z "$ROOT" ]; then
            echo "没有找到 Android 工程"
            exit 1
          fi

          echo "Android 工程:"
          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      # 7. 设置 Gradle
      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          chmod +x gradlew

      # 8. 构建 APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}
        env:
          GRADLE_OPTS: "-Xmx4096m"
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      # 9. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Trader-V2-APK
          path: |
            ${{ steps.project.outputs.root }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
