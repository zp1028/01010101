name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source ZIP
        run: |
          set -e
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No zip in repo root"
            exit 1
          fi
          echo "ZIP=$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Debug APK
        run: |
          set -e
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
            ROOT=$(dirname "$FOUND")
          fi
          echo "ROOT=$ROOT"
          cd "$ROOT"
          rm -rf .gradle
          if [ -f ./gradlew ]; then
            sed -i 's/\r$//' ./gradlew || true
            chmod +x ./gradlew
            ./gradlew --no-daemon clean assembleDebug --stacktrace
          else
            gradle --no-daemon clean assembleDebug --stacktrace
          fi
          APK=$(find . -path "*/outputs/apk/debug/*.apk" -type f | head -1)
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$APK" "$GITHUB_WORKSPACE/artifacts/app-debug.apk"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -9 caifenxi-debug.zip app-debug.apk

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-zip
          path: artifacts/caifenxi-debug.zip

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-apk
          path: artifacts/app-debug.apk
