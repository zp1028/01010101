name: 解压并构建APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 解压 ZIP
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "仓库根目录没有 zip，跳过"
            exit 0
          fi
          echo "解压: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src

      - name: 定位项目
        run: |
          set -e
          FOUND=""
          if [ -f _src/SmartTraderApp/build.gradle ]; then
            FOUND="_src/SmartTraderApp"
          elif [ -f _src/build.gradle ]; then
            FOUND="_src"
          else
            FOUND=$(find _src -name "build.gradle" -not -path "*/app/*" -type f 2>/dev/null | head -1 | xargs -r dirname)
          fi
          if [ -z "$FOUND" ] || [ ! -d "$FOUND" ]; then
            echo "找不到项目根目录"
            find _src -maxdepth 3 -name "*.gradle" | head -30
            exit 1
          fi
          FOUND=$(cd "$FOUND" && pwd)
          echo "dir=$FOUND" >> "$GITHUB_ENV"
          echo "项目根目录: $FOUND"

      - name: 准备 SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'sdk.dir=%s\n' "$SDK" > "$dir/local.properties"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: 构建
        id: build
        continue-on-error: true
        working-directory: ${{ env.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: 错误摘要
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "❌ 构建失败 - 错误摘要"
          echo "=========================================="
          echo ""
          echo "--- 关键错误行 ---"
          grep -E "FAILURE:|What went wrong:|error:|Error:|Caused by:|Non-zero exit|Chaquopy:" build.log | head -20
          echo ""
          echo "--- 建议 ---"
          echo "1. 往上翻找到 '构建' 步骤"
          echo "2. 展开它，找红色错误字"
          echo "3. 截图发给我"
          echo "=========================================="
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: smart-trader-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
