name: Complete APK Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Source ZIP
        run: |
          set -euo pipefail
          echo "📦 开始查找压缩包..."
          ZIP_FILE=$(ls *.zip 2>/dev/null | head -1 || true)
          if [ -z "${ZIP_FILE:-}" ]; then
            echo "❌ 错误：仓库根目录没有找到 .zip 文件"
            exit 1
          fi
          echo "✅ 找到压缩包: $ZIP_FILE"
          unzip -q -o "$ZIP_FILE" -d .
          echo "✅ 解压完成"

      - name: Locate Project Root
        id: locate_root
        run: |
          set -euo pipefail
          echo "🔍 查找 settings.gradle(.kts)..."
          if [ -f settings.gradle.kts ] || [ -f settings.gradle ]; then
            ROOT="."
          else
            FOUND=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -1 || true)
            if [ -z "${FOUND:-}" ]; then
              echo "❌ 错误：找不到 settings.gradle(.kts)"
              find . -maxdepth 3 -type f | head -50
              exit 1
            fi
            ROOT=$(dirname "$FOUND")
          fi
          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "📂 项目根目录: $ROOT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Tools
        run: |
          set -euo pipefail
          echo "📦 安装 Android SDK 工具..."
          # 强制使用绝对路径，防止 PATH 问题
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "build-tools;34.0.0" \
            "platform-tools" \
            2>&1 | grep -v "Warning" | tail -20
          echo "✅ Android SDK 工具安装完成"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          add-job-summary: on

      - name: Clean Gradle Cache
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"
          echo "🧹 清理 Gradle..."
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean --no-daemon 2>&1 | tail -20 || true
          else
            gradle clean --no-daemon 2>&1 | tail -20 || true
          fi

      - name: Build Debug APK
        id: build_apk
        run: |
          set -euo pipefail
          ROOT="${{ steps.locate_root.outputs.root }}"
          cd "$ROOT"
          echo "🔨 开始构建 Debug APK..."
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon 2>&1 | tail -200
            BUILD_EXIT=$?
          else
            gradle assembleDebug --no-daemon 2>&1 | tail -200
            BUILD_EXIT=$?
          fi
          if [ $BUILD_EXIT -eq 0 ]; then
            echo "✅ APK 构建成功！"
            echo "build_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ APK 构建失败，退出码: $BUILD_EXIT"
            echo "build_success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: caifenxi-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/
            **/build/outputs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Summary
        if: always()
        run: |
          echo "## 📊 构建报告" >> $GITHUB_STEP_SUMMARY
          echo "- **时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.build_apk.outputs.build_success }}" == "true" ]; then
            echo "### ✅ 构建状态: 成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 构建状态: 失败" >> $GITHUB_STEP_SUMMARY
          fi
