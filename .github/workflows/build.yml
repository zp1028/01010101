name: Build APK From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. 获取当前仓库
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. 使用 GitHub Runner 自带 Android SDK
      - name: Check Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true

          echo "Android build tools:"
          ls -la "$ANDROID_HOME/build-tools" || true

          echo "sdkmanager:"
          command -v sdkmanager || true

      # 4. 找源码 ZIP
      - name: Find Source ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP=$(find . \
            -type f \
            -iname "*.zip" \
            -not -path "./.git/*" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No source ZIP found."
            exit 1
          fi

          echo "Using source ZIP:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 5. 解压源码
      - name: Extract Source ZIP
        run: |
          set -e

          rm -rf source
          mkdir -p source

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d source

          echo "Source extracted successfully."

          find source -maxdepth 4 -type f | head -200

      # 6. 自动寻找 Android 工程
      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          ROOT=""

          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/gradlew" ]; then
              ROOT="$DIR"
              break
            fi
          done < <(
            find source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \)
          )

          if [ -z "$ROOT" ]; then
            echo "ERROR: Android Gradle project not found."

            echo ""
            echo "gradlew files:"
            find source \
              -type f \
              -name "gradlew" \
              -print

            echo ""
            echo "settings files:"
            find source \
              -type f \
              \( \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          echo "Android project root:"
          echo "$ROOT"

          echo "root=$ROOT" >> "$GITHUB_OUTPUT"

      # 7. 检查工程
      - name: Check Android Project
        working-directory: ${{ steps.project.outputs.root }}
        shell: bash
        run: |
          set -e

          echo "Project:"
          pwd

          echo ""
          echo "Gradle:"
          ./gradlew --version

          echo ""
          echo "Project files:"
          ls -la

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

      # 8. Gradle 权限
      - name: Prepare Gradle
        working-directory: ${{ steps.project.outputs.root }}
        run: |
          chmod +x gradlew

      # 9. 构建 Debug APK
      - name: Build APK
        working-directory: ${{ steps.project.outputs.root }}
        env:
          GRADLE_OPTS: "-Xmx4096m"
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. 上传 APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Trader-V2-APK
          path: |
            ${{ steps.project.outputs.root }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
