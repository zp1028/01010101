name: 解压并构建APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: 解压 ZIP
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then
            echo "仓库根目录没有 zip，跳过解压"
            exit 0
          fi
          echo "解压: $ZIP"
          mkdir -p _src
          unzip -q -o "$ZIP" -d _src

      - name: 定位 Android 项目根目录
        run: |
          set -e
          FOUND=""
          if [ -f _src/SmartTraderApp/build.gradle ]; then
            FOUND="_src/SmartTraderApp"
          elif [ -f _src/build.gradle ]; then
            FOUND="_src"
          else
            FOUND=$(find _src -name "build.gradle" -not -path "*/app/*" -type f 2>/dev/null | head -1 | xargs -r dirname)
          fi
          if [ -z "$FOUND" ] || [ ! -d "$FOUND" ]; then
            echo "ERROR: 找不到 Android 项目根目录"
            echo "=== _src 目录结构 ==="
            find _src -maxdepth 3 -name "*.gradle" | head -30
            exit 1
          fi
          FOUND=$(cd "$FOUND" && pwd)
          echo "PROJECT_ROOT=$FOUND"
          echo "dir=$FOUND" >> "$GITHUB_ENV"
          echo "项目根目录: $FOUND"

      - name: 准备 Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK/licenses/android-sdk-license"
          printf '84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          printf 'sdk.dir=%s\n' "$SDK" > "$dir/local.properties"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          cat "$dir/local.properties"

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: 构建 Debug APK
        id: build
        continue-on-error: true
        working-directory: ${{ env.dir }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: 失败反馈报告
        if: steps.build.outcome == 'failure'
        run: |
          echo ""
          echo "╔══════════════════════════════════════════╗"
          echo "║       ❌ APK 构建失败 - 诊断报告        ║"
          echo "╚══════════════════════════════════════════╝"
          echo ""
          echo "【错误位置】"
          echo "  请往上翻找到 '构建 Debug APK' 步骤"
          echo "  展开它，找带 FAILURE: 或 What went wrong: 的行"
          echo ""
          echo "【常见原因排查清单】"
          echo ""
          echo "  □ Chaquopy 插件版本和 Gradle 不兼容"
          echo "    → 检查 Gradle 版本（当前锁定 8.9）"
          echo ""
          echo "  □ ndk.abiFilters 没配置"
          echo "    → app/build.gradle 的 defaultConfig 里要有:"
          echo "      ndk {"
          echo "        abiFilters \"armeabi-v7a\", \"arm64-v8a\""
          echo "      }"
          echo ""
          echo "  □ Python 依赖编译失败"
          echo "    → 某个包不支持 arm 架构"
          echo "    → 检查 chaquopy.pip 里的包版本"
          echo ""
          echo "  □ Android SDK 版本不对"
          echo "    → compileSdk 34 需要 SDK Platform 34"
          echo ""
          echo "  □ 项目路径找错了"
          echo "    → 没找到 build.gradle"
          echo "    → 检查解压后的目录结构"
          echo ""
          echo "【下一步】"
          echo "  1. 截图 '构建 Debug APK' 步骤的红色错误部分"
          echo "  2. 发给我，我帮你定位具体问题"
          echo ""
          echo "╚══════════════════════════════════════════╝"
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: smart-trader-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
