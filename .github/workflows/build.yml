                            ExecutorViewModel.ExecutorStatus.COMPLETED -> "已完成"
                            ExecutorViewModel.ExecutorStatus.FAILED -> "失败"
                            ExecutorViewModel.ExecutorStatus.CANCELLED -> "已取消"
