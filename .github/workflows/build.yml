                }
            }
        }

        Spacer(Modifier.height(CaiTokens.S16))

        GlobalCard {
            Text("控制面板", fontWeight = FontWeight.Bold)
            Spacer(Modifier.height(CaiTokens.S8))
            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(CaiTokens.S8)) {
